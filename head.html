<meta name="viewport" content="width=device-width, initial-scale=1"/>
<script>
    const brandCode = [...document.head.querySelectorAll(`meta[name="brand"]`)]
      .map((m) => m.content)
      .join(', ');
    const themeCode = [...document.head.querySelectorAll(`meta[name="theme"]`)]
      .map((m) => m.content)
      .join(', ');
    const brandPath = `${(brandCode !== '') ? `${brandCode}/` : ''}`;
    const themePath = `${(themeCode !== '') ? `${themeCode}/` : ''}`;
    const link = document.createElement("link");
      link.rel = "stylesheet";
      link.href = `/styles/${brandPath}${themePath}styles.css`;
      link.type = "text/css";
      document.head.appendChild(link);
</script>
<script src="/scripts/aem.js" type="module"></script>
<script src="/scripts/scripts.js" type="module"></script>
<link rel="stylesheet" href="/styles/styles.css"/>
